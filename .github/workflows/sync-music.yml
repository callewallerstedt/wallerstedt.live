name: Sync music catalogue

# Checks Spotify for new Wallerstedt releases every morning and commits them,
# which redeploys the site on Vercel. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-catalog.mjs
      - name: Commit new releases
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard public/media/songs)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "wallerstedt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/song-catalog.json lib/catalog-extra.json public/media/songs
          git commit -m "Add new releases from Spotify"
          git push
